<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Security: this policy lets the page run ONLY its own files. It forbids every network
  request from page code (connect-src 'none'), inline scripts/styles, plugins, frames,
  and form posts. Nothing in this app talks to any server.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101e25">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Neuro Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hub.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/games.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/rooms.css">
  <link rel="stylesheet" href="css/expansion.css">
<link rel="stylesheet" href="css/curio.css">
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif;color:#fff">Neuro Arcade needs JavaScript to run. It never sends data anywhere.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
